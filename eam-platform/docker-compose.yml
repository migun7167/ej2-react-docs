name: eam

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - web
    restart: always

  web:
    build: ./apps/web
    image: eam-web:${TAG:-local}
    restart: always

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: eam-api:${TAG:-local}
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@postgres:5432/eam
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: always

  worker:
    image: eam-api:${TAG:-local}
    command: node dist/worker.js
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@postgres:5432/eam
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
    depends_on:
      api:
        condition: service_healthy
    restart: always

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: eam
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eam"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always
    # ไม่ publish port — เข้าจาก host ด้วย: docker compose exec postgres psql -U postgres eam

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: always

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    restart: always

  # --- profile: auth — Keycloak (MVP รัน AUTH_MODE=dev ได้โดยไม่ต้องเปิด) ---
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    profiles: [auth]
    command: start --proxy-headers xforwarded --http-enabled true --hostname-strict false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/eam
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # --- profile: tiles — self-host OSM (production ห้ามใช้ public tile) ---
  tileserver:
    image: maptiler/tileserver-gl:latest
    profiles: [tiles]
    volumes:
      - ./ops/tiles/data:/data
    restart: always

volumes:
  pg_data:
  redis_data:
  minio_data:
  caddy_data:
